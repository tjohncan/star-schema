description = """
The Nemean lion in profile, walking west: nostrils, open mouth, a two-star
head and a three-star neck curving down to the heart — where Regulus sits,
named in the catalogue, the little king at the centre of the beast. That
head-to-heart curve is the hook modern skywatchers call the Sickle. The
body runs along belly, loins and rump to the tail's tip star, Denebola,
with four legs planted beneath. In the unformed margin behind the lion
floats the 'nebulous convolution called Berenice's Hair' — the queen's
sacrificed locks, catalogued here as Leo's leftovers three centuries
before anyone drew them as their own constellation."""

