description = """
The great hunter at full stride, and the catalogue's richest single figure:
a nebulous head between two named shoulders — the reddish Brilliant One
(Betelgeuse) and its partner (Bellatrix) — a club raised in the right hand
above a four-star fist, and over the left arm a pelt or shield of NINE
stars, counted off with bureaucratic patience: 'second from the
northernmost, third from the northernmost…' down to the ninth. Across the
waist, the three-star belt; hanging from it the sword, with a hilt, a
three-star tip 'joined together', and two more below. The left foot is the
brilliant Rigel, 'shared with the water' — the river Eridanus rises right
beside it. Thirty-eight stars, no unformed: like Draco, Orion wasted
nothing."""

