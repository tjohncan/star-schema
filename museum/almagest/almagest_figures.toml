# almagest_figures.toml
# Figure edge sets for Ptolemy's 48 constellations, after the anatomy of the
# Almagest star descriptions (Peters & Knobel 1915). Strokes are polylines
# through FIGURE-star sequence numbers (see almagest_stars.csv; unformed stars
# never appear in strokes). A repeated first number closes a polygon.
# Where Ptolemy's anatomy dictates a connection, the comment says so; where it
# is silent, the stroke is our artistic license and says that instead.

[[constellation]]
code = "UMi"
name_latin = "Ursa Minor"
name_english = "The Little Bear"
stars_figure = 7
stars_unformed = 1
description = """
Seven stars, and not one wasted: a long tail rising to the pole, ending in the
quadrilateral of the body. Star 1 — the tip of the tail — is Polaris, which in
Ptolemy's day was NOT the pole star; it sat a full 12 degrees off the pole, an
unremarkable tail-tip that precession has since promoted to the axis of the
world. The anatomy alone reproduces the modern Little Dipper exactly: handle
and bowl, drawn from a 2nd-century text with zero degrees of freedom."""

[[constellation.stroke]]
name = "tail"
comment = "Anatomy: tail tip (Polaris) back to the tail's root, joining the body."
stars = [1, 2, 3, 4]

[[constellation.stroke]]
name = "body"
comment = "Anatomy: the figura quadrilatera — preceding side 4-5, following side 6-7."
stars = [4, 5, 7, 6, 4]

[[constellation]]
code = "UMa"
name_latin = "Ursa Major"
name_english = "The Great Bear"
stars_figure = 27
stars_unformed = 8
description = """
The whole animal, not just the Dipper: a muzzle, paired eyes and brow, an ear,
neck, chest, four legs with feet, and the famous hindquarters. Ptolemy's
figura quadrilatera — back (Dubhe), flank (Merak), tail-root (Megrez), left
hind thigh (Phecda) — IS the Big Dipper's bowl, and 'the three placed in the
tail' (Alioth, Mizar, Alkaid) are its handle. A bear with a long tail is bad
zoology and perfect astronomy. The eight unformed stars drift south and west
toward Leo and Gemini; centuries later Hevelius quarried that empty margin for
Lynx and Leo Minor — you can watch the raw material waiting in this data."""

[[constellation.stroke]]
name = "head"
comment = "Anatomy: muzzle-tip through the eye pair to the brow pair, ear as spur."
stars = [1, 2, 3, 5, 4]

[[constellation.stroke]]
name = "ear-spur"
comment = "Anatomy: the preceding ear's tip, hung from the brow."
stars = [5, 6]

[[constellation.stroke]]
name = "neck-and-chest"
comment = "Anatomy: neck pair into the chest pair. License: joined at the brow."
stars = [4, 7, 8, 9, 10]

[[constellation.stroke]]
name = "left-foreleg"
comment = "Anatomy: chest to left knee to the forefoot pair."
stars = [10, 11, 12, 13]

[[constellation.stroke]]
name = "right-foreleg"
comment = "Anatomy: above and below the right knee. License: hung from the chest."
stars = [9, 14, 15]

[[constellation.stroke]]
name = "spine"
comment = "License: neck to Dubhe, joining head to hindquarters."
stars = [8, 16]

[[constellation.stroke]]
name = "body"
comment = "Anatomy: the figura quadrilatera — the Dipper's bowl (Dubhe, Merak, Phecda, Megrez)."
stars = [16, 17, 19, 18, 16]

[[constellation.stroke]]
name = "left-hindleg"
comment = "Anatomy: thigh to hock to hind-foot pair."
stars = [19, 22, 20, 21]

[[constellation.stroke]]
name = "right-hindleg"
comment = "Anatomy: right hind-foot pair. License: hung from the flank."
stars = [17, 23, 24]

[[constellation.stroke]]
name = "tail"
comment = "Anatomy: 'the three placed in the tail' — the Dipper's handle."
