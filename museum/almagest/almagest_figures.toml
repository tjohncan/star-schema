description = """
The cup-bearer — Ganymede, if you like — stands with a jar tipped from his
right hand, and what he pours is most of the constellation: twenty of his
forty-two stars belong to the water itself, tumbling south star by star
through named bends, pairs, a solitary drop, and three coiling runs, until
'the last star of the water' lands in the mouth of the Southern Fish — the
shared star, Fomalhaut, where one constellation ends inside another. The
man himself is quieter: head, shoulders, a drapery of three at the left
hand, hips and legs — scaffolding for the pour."""

