three-star palm; the torso hangs from two side stars, and both legs fold
beneath him in long chains of thigh, knee, and foot. His right foot is 'the
very same star as the tip of the crook' — one point of light doing double
duty as the Kneeler's toe and the end of Boötes' shepherd's staff."""

