name_english = "The Bull"
stars_figure = 33
stars_unformed = 11
description = """
Half a bull, like Pegasus is half a horse: the figure begins at the
abscissio, the cut-off — four stars marking where the body simply ends — and
charges west from there, head lowered. The face is the Hyades, named in the
catalogue itself ('for so are called those in the face'), a V of five stars
with the bright reddish one, Aldebaran, in the southern eye. The long horns
reach north and south; the northern tip is the star shared with Auriga's
right foot. And riding above the shoulder, the Pleiades — the Seven Sisters
compressed to four catalogue entries, a tiny figure with named ends, granted
its own geometry inside the Bull. The disguise Zeus wore for Europa, drawn
mid-charge."""

