name_english = "The Ship Argo"
stars_figure = 45
stars_unformed = 0
description = """
The largest constellation in the catalogue: Jason's ship, sailing the
far southern sky stern-first — and only half a ship, like the half-horse
and half-bull; the prow is lost in fog or below the horizon, depending on
who you ask. The parts are real ship's parts: stern-post and little
shields, a goose-head ornament (the cheniskos, 'or the little goose'),
keel, decks, a mast with foot, middle and tip, a cut-off where the hull
ends, and two steering-oars — in the southern one, 'the preceding of the
two remaining, and it is called Canopus', the second-brightest star in
the sky, steering the whole vessel. Eighteen centuries later the ship was
broken up into Carina, Puppis and Vela; here it still sails whole."""

