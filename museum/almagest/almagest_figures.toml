The king of Aethiopia stands near the pole wearing a tiara — the pointed
Persian royal cap — which gets three stars of its own while his head gets
none: Cepheus is drawn crown-first. Feet, belt, shoulders, a chest and a left
arm sketch the standing figure; the modern 'house' asterism lives in the same
stars. His two unformed stars bracket the tiara, one preceding and one
following, like attendants who missed the portrait."""

