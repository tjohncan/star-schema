[[constellation]]
code = "Boo"
name_latin = "Bootes"
name_english = "The Herdsman"
stars_figure = 22
stars_unformed = 1
description = """
The Herdsman strides after the Bears carrying a collorobus — a shepherd's
crook — in his right hand and a club below the shoulder. Left hand, elbow,
shoulders and head give the upper body; belt, legs, heel and a left-shin trio
plant him on the sky. And then the astonishment: Arcturus, fourth-brightest
star in the heavens, is UNFORMED — 'between the thighs, called Arcturus,
reddish' — catalogued beside the figure but not part of it. The brightest
thing the Herdsman owns is not attached to him. It floats at his knees,
edgeless by ancient decree, and this dataset keeps it that way."""

