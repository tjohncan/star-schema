three, and — the part everyone remembers — a tight rhombus of four for the
head, the little kite-shape that skywatchers would much later nickname Job's
Coffin. The catalogue calls it plainly what it is: a quadrilateral rhomboid,
preceding side and following side. This is the dolphin that carried the
singer Arion safely to shore, paid for the rescue with a place in the sky."""

