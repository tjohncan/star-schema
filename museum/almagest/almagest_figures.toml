name_english = "The Winged Horse"
stars_figure = 20
stars_unformed = 0
description = """
Half a horse, upside down: head, neck, mane, chest, forelegs and wings —
and nothing at all behind the navel, where the figure simply stops. That
navel star is 'shared with the head of Andromeda': one star finishing the
horse and starting the princess. With the loins, the shoulder, and the
wing-shoulder it frames the Great Square, the huge empty box of autumn
skies; from the chest the neck stretches out through close-set pairs —
neck, mane, head — to the single star in the muzzle. The wings get their
tips, the forelegs their knees and ankles, and the rest is left to flight."""

