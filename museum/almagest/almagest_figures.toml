description = """
Two fish swimming apart, bound tail-to-tail by long cords that meet at a
single star: 'the one at the knot of the two cords' — the Knot, whose
modern name Alrescha still means the cord. The preceding fish hangs below
the Great Square of Pegasus, drawn as mouth, skull, back, belly, tail; from
its tail one cord runs east through bright trios and a bend to the Knot,
and the northern cord climbs from there to the following fish, which leaps
upward toward Andromeda — its southern fin catalogued as 'behind the elbow
of Andromeda'. Mother and son of the Syrian goddess story, escaped into
water, tied so they would never be separated."""

