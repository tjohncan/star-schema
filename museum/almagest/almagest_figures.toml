[[constellation]]
code = "Dra"
name_latin = "Draco"
name_english = "The Dragon"
stars_figure = 31
stars_unformed = 0
description = """
Thirty-one stars and the longest sentence in the northern sky: a dragon coiled
between the two Bears. The anatomy reads like driving directions — tongue,
mouth, jaw, eye, crown; a straight-line trio at the first bend of the neck; a
quadrilateral coil; then TWO triangles, a pair of small stars off the western
one, straight-line trios and pairs unwinding westward until the tail's bend
and its final tip. Ptolemy narrates each curve of the serpent in order, so the
figure is nearly self-drawing: one long spine that loops through every group.
No unformed stars — the Dragon used everything it had."""

[[constellation.stroke]]
name = "head"
comment = "Anatomy: tongue leads to mouth; jaw, eye and crown close the head lozenge."
stars = [1, 2, 4, 3, 5, 2]

[[constellation.stroke]]
name = "neck"
comment = "Anatomy: crown into the straight-line trio at the first bend (N, mid, S), then the eastward follower."
stars = [5, 6, 8, 7, 9]

[[constellation.stroke]]
name = "first-coil"
comment = "Anatomy: the quadrilateral at the following bend; entered from the neck, exited south."
stars = [9, 11, 10, 13, 12, 11]

[[constellation.stroke]]
name = "second-coil-triangles"
comment = "Anatomy: two triangles back-to-back; the following (eastern) then the preceding (western)."
stars = [13, 14, 15, 16, 14]

[[constellation.stroke]]
name = "western-triangle"
comment = "Anatomy: the preceding triangle, with its two small outliers to the west."
stars = [16, 17, 18, 19, 17]

[[constellation.stroke]]
name = "small-pair"
comment = "Anatomy: the two small stars at the western part of the triangle."
stars = [19, 20, 21]

[[constellation.stroke]]
name = "tail"
comment = "Anatomy: straight-line trio, westward pair, the tail's bend, a distant pair, then tip. One unwinding stroke."
stars = [21, 24, 23, 22, 25, 26, 27, 28, 29, 30, 31]

