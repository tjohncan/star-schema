description = """
Ariadne's wedding crown, flung into the sky: eight stars in a small, perfect
arc, described almost entirely by their order in the curve — 'the one
preceding them all', then follower after follower to 'the last of all those in
the crown'. Star 1 is the Brilliant One (Fulgens), today's Alphecca or Gemma,
the jewel set in the ring. Ptolemy's sequence walks the arc itself; one bent
stroke draws the whole diadem, with one small northern companion riding just
above the band."""

