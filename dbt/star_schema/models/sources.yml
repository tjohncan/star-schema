
version: 2

sources:
  - name: prepared
    description: >
      Carried third-party extracts in data/prepared/,
      read in place as external files — never loaded, never hand-edited;
      regenerated by scripts/prep_sources.py.
      Upstream terms and citations in SOURCES.md.
    meta:
      external_location: "../../data/prepared/{name}.csv"
    tables:

      - name: vvg_almagest_crosswalk
        description: >
          Thin Baily-to-HIP crosswalk from Verbunt & van Gent (2012),
          A&A 544, A31 — the identifications are their scholarly contribution.
          Ptolemy's magnitudes are ancient facts they transcribed.
          The ledger's one tier-3 exception (see SOURCES.md).
        columns:
          - name: baily
            data_tests:
              - unique
              - not_null
          - name: hip
            description: "Hipparcos identifier; null where the star is unidentified."
          - name: id_quality
            description: "V&vG identification grade: 1–2 secure, 3 probable, 4 possible, 5 not identified, 6 repeated entry."
            data_tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: [1, 2, 3, 4, 5, 6]
                    quote: false
          - name: ptolemy_mag
            description: "Ptolemy's magnitude class 1–6; V&vG special values: 7 faint, 9 nebulous."
          - name: mag_qualifier
            description: "Ptolemy's qualifier: b somewhat brighter, f somewhat fainter."

      - name: yale_bright_star
        description: >
          Yale Bright Star Catalogue, 5th revised edition (Hoffleit & Warren 1991)
          — the naked-eye sky, keyed by HR number.
          14 "ghost" entries (novae and friends) hold blank positions.
        columns:
          - name: hr
            data_tests:
              - unique
              - not_null
          - name: vmag
            description: "Johnson V magnitude (vmag_code flags non-standard systems)."
