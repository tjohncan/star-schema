
version: 2

models:
  - name: int_star_bridge
    description: >
      Baily-grain key bridge (baily -> HIP -> HD -> HR) with J2000-propagated
      Hipparcos positions; BSC-position fallback for the two hip_main-less
      binaries.
    columns:
      - name: baily
        data_tests:
          - unique
          - not_null

  - name: int_wgsn_name
    description: >
      Each IAU proper name resolved to a Yale HR number, one name per star.
      WGSN states an HR outright for 415 of its 597 names; the rest it
      designates by Bayer letter (multiple-star systems) or by HD/GJ number,
      and those are resolved here through bayer_id — against the Greek alphabet
      seed, or as a Flamsteed number — so that Acrux and Alnitak reach the sky.
    columns:
      - name: proper_name
        data_tests:
          - unique
          - not_null
      - name: hr
        description: >
          Yale HR number. Unique by construction: where two names claim one
          star, the one WGSN stated outright keeps it and the inferred one is
          dropped, so Betelgeuse holds HR 2061 against its companion's name.
        data_tests:
          - unique
          - not_null
      - name: match_via
        description: "Which route resolved it — WGSN's own HR, or our Bayer / Flamsteed inference."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['designation', 'bayer', 'flamsteed']

  - name: int_star_name
    description: "Naming waterfall per Yale star: proper > Bayer > Flamsteed > HR."
    columns:
      - name: hr
        data_tests:
          - unique
          - not_null
      - name: name
        data_tests:
          - not_null
      - name: name_tier
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['proper', 'bayer', 'flamsteed', 'hr']

  - name: atlas_star
    description: "Backdrop pool: every placeable Yale bright star, named."
    columns:
      - name: hr
        data_tests:
          - unique
          - not_null
      - name: ra_deg
        data_tests:
          - not_null
      - name: dec_deg
        data_tests:
          - not_null

  - name: atlas_almagest_member
    description: "All 1,028 Almagest entries, render-ready with honest nulls."
    columns:
      - name: baily
        data_tests:
          - unique
          - not_null
      - name: name
        data_tests:
          - not_null

  - name: atlas_constellation
    description: "One scene per Ptolemaic constellation: camera, prose, stats."
    columns:
      - name: constellation
        data_tests:
          - unique
          - not_null
      - name: view_ra_deg
        data_tests:
          - not_null
      - name: view_dec_deg
        data_tests:
          - not_null
      - name: fov_deg
        data_tests:
          - not_null

  - name: atlas_stroke_point
    description: "Stroke polylines resolved to positioned stars."
    columns:
      - name: baily
        data_tests:
          - not_null
